# Render the Quarto site and deploy it to GitHub Pages on every push to main.
#
# Nothing is executed here: Rmd pages are rebuilt from the frozen results in
# _freeze/ and notebook pages from the outputs saved in each .ipynb, so the
# runner needs neither R, Python, nor the data. If an Rmd changes without its
# _freeze/ being re-rendered and committed, Quarto will try to run it and this
# job will fail.
#
# One-time setup: Settings > Pages > Source: "GitHub Actions".

name: Publish site

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let an in-progress deploy finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          # match the version used to render _freeze/ locally
          version: 1.10.18

      - name: Render
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
